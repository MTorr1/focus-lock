<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focus Lock</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="sheet">
      <header>
        <h1>Focus Lock</h1>
        <p>Block a site, a section, or a single page. A lock or a committed schedule cannot be weakened until it ends.</p>
      </header>
      <p id="error" class="error" hidden></p>
      <section>
        <h2>New list</h2>
        <form id="create-form">
          <label>Name <input name="name" required maxlength="80" placeholder="Social media" /></label>
          <button type="submit">Create list</button>
        </form>
      </section>
      <section id="lists"></section>
      <section>
        <h2>Account</h2>
        <p>Optional. Lists, locks, and schedules work on this Mac without an account. Passwords stay with Supabase.</p>
        <form id="config-form">
          <label>Project URL <input name="url" type="url" placeholder="https://your-project.supabase.co" /></label>
          <label>Anon key <input name="anonKey" type="password" autocomplete="off" /></label>
          <button type="submit">Save connection</button>
        </form>
        <form id="auth-form">
          <label>Email <input name="email" type="email" autocomplete="username" /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" /></label>
          <button type="submit" name="action" value="sign-in">Log in</button>
          <button type="submit" name="action" value="sign-up">Create account</button>
          <button type="button" id="sign-out">Log out</button>
        </form>
        <p id="account-status"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
